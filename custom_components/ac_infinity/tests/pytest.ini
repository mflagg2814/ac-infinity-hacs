[pytest]
# Run from the repository root. custom_components has no __init__.py -- it's a
# namespace directory -- so pytest's default import mode roots the test package at
# custom_components/ and drops the repository root from sys.path, which makes
# `import custom_components.ac_infinity` fail. This puts it back.
pythonpath = ../../.. ../../tests
asyncio_mode = auto
addopts = -q -p custom_integrations_cache --cov-config=custom_components/ac_infinity/tests/.coveragerc
